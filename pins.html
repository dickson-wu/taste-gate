<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Taste Gate: checked pins</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="glass.css">
<style>
  body { max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-radius: 999px; padding: 8px 10px 8px 16px; margin-bottom: 18px; }
  .toolbar .grow { flex: 1; font-size: 13px; color: var(--soft); }
  .seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(0, 40, 12, .22); }
  .seg button { border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer; font: 600 13px 'Urbanist', 'Segoe UI', sans-serif; color: #fff; background: transparent; }
  .seg button.on { color: #10351a; background: radial-gradient(120% 90% at 30% 10%, rgba(250,255,215,.98), rgba(215,245,100,.85) 45%, rgba(160,215,45,.9)); }
  .agree { color: var(--lime); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .pin { border-radius: 22px; overflow: hidden; }
  .pic { position: relative; display: block; aspect-ratio: 3 / 4; background: rgba(0, 40, 12, .3); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
  .pin.flag .pic::after { box-shadow: inset 0 0 0 3px rgba(239, 68, 68, .95), inset 0 0 18px 2px rgba(239, 68, 68, .45); }
  .pin.unsure .pic::after { box-shadow: inset 0 0 0 3px rgba(245, 158, 11, .95), inset 0 0 18px 2px rgba(245, 158, 11, .45); }
  .pin.keep .pic::after { box-shadow: inset 0 0 0 3px rgba(74, 222, 128, .95), inset 0 0 18px 2px rgba(74, 222, 128, .4); }
  .info { padding: 10px 12px 12px; display: grid; gap: 8px; }
  .why { font-size: 13.5px; font-weight: 600; }
  .why small { display: block; font-weight: 300; color: var(--faint); font-size: 12px; margin-top: 2px; }
  .vote { display: flex; gap: 6px; }
  .vote button { flex: 1; padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .vote button.on { color: #10351a; background: radial-gradient(120% 90% at 30% 10%, rgba(250,255,215,.98), rgba(215,245,100,.85) 45%, rgba(160,215,45,.9)); border-color: transparent; }
  .empty { color: var(--soft); padding: 60px 0; text-align: center; }
  body.light .seg { background: rgba(255, 255, 255, 0.6); box-shadow: inset 0 1px 3px rgba(20, 50, 10, 0.12); }
  body.light .seg button { color: #0f1f14; }
  body.light .seg button.on { color: #10351a; }
  body.light .pic { background: #e6f0dc; }
  body.light .agree { color: #1f6b14; }
</style>
</head>
<body class="light">
  <div class="top"><div><div class="hello">Checked pins</div><div class="title">Taste <b>Gate</b></div></div></div>
  <p class="label" style="margin:0 0 16px">Every pin Taste Gate checked, judged with your current taste. Vote on the ones it got wrong, then export your votes to improve your taste with AI. <span id="agree" class="agree"></span></p>
  <div class="toolbar glass">
    <span class="seg" id="show">
      <button data-f="" class="on">All</button><button data-f="keep">Green</button><button data-f="unsure">Orange</button><button data-f="flag">Red</button><button data-f="voted">Voted</button>
    </span>
    <span id="count" class="grow"></span>
    <button class="bubble" id="export">Export votes</button>
    <button class="ghost" id="clear">Delete all</button>
  </div>
  <div id="grid" class="grid"></div>
<script src="taste.js"></script>
<script src="page.js"></script>
<script src="pins.js"></script>
</body>
</html>
